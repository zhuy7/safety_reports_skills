[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-reports-skill"
version = "0.2.0"
description = "Two independent skills: PDF → accident summary + chain extraction, and phrases → cause taxonomy tree."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
file = ["pypdf>=6.9,<7", "python-docx>=1.0"]

[project.scripts]
safety-reports-skill = "safety_reports_skill.pipeline:main"
accident-phrase-taxonomy-skill = "phrase_taxonomy_skill.taxonomy:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
